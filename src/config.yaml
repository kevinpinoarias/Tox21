project:
  name: tox21-toxicity-predictor
  random_state: 42

data:
  path: data/tox21.csv
  drop_missing_smiles: true
  drop_duplicate_smiles: true
  label_handling: keep
  drop_rows_with_all_missing_labels: true

split:
  test_size: 0.2
  shuffle: true

featurization:
  method: morgan
  smiles_column: smiles
  radius: 2
  n_bits: 2048

model:
  name: logistic_regression

logistic_regression:
  max_iter: 1000
  class_weight: balanced
  solver: liblinear
  C: 1.0

random_forest:
  n_estimators: 300
  max_depth: null
  min_samples_split: 2
  min_samples_leaf: 1
  class_weight: balanced
  n_jobs: -1

xgboost:
  n_estimators: 300
  max_depth: 6
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  n_jobs: -1
  eval_metric: logloss

neural_network:
  hidden_dim: 256
  dropout: 0.2
  learning_rate: 0.001
  batch_size: 64
  epochs: 20

outputs:
  base_dir: outputs
  metrics_dir: outputs/metrics
  plots_dir: outputs/plots
  predictions_dir: outputs/predictions
  error_analysis_dir: outputs/error_analysis
  models_dir: models_saved